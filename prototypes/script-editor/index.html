<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kildeverket — script editor probe</title>
    <style>
      /* Fonts arrive at runtime: main.ts injects @font-face for the bake TTFs
         (templates/docs/fonts) so the rail uses the exact in-game families. */
      /* PM Board tokens (extracted from the handoff design system) */
      /* PM Board tokens live in prototypes/shared/surfaces.css (SB-082);
         only the script-page extras stay here. */
      :root {
        --bg-rail: #111218;
        --tint-danger: rgba(229, 72, 77, 0.12);
        /* paper/ink tokens from prototypes/blueprint_v1.html — the game surface */
        --paper: #f5f1e8;
        --paper-shade: #ece7d8;
        --ink: #2a2520;
        --ink-dim: #6b6259;
        --ink-faint: #a49a8c;
        --hint-gold: #c89a2e;
        --hint-warn: #c86244;
        --hint-green: #7aa66f;
        --hint-blue: #5b7fc4;
        --hint-purple: #a57bc2;
        --mark: #fff8b0;
        --hand-1: 'Kalam', cursive;
        --hand-2: 'Caveat', cursive;
        --hand-3: 'Architects Daughter', cursive;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: 44px 1fr 28px;
        grid-template-columns: 220px 1fr 400px;
        grid-template-areas:
          'top top top'
          'outline editor rail'
          'status status status';
        height: 100vh;
      }

      /* top bar */
      #topbar {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-side);
      }
      #topbar .logo {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: linear-gradient(135deg, #7b83eb, #4c56c0);
      }
      #topbar .name {
        font: 600 12.5px var(--sans);
      }
      #topbar .file {
        font: 500 10.5px var(--mono);
        color: var(--text-3);
        background: none;
        border: none;
        cursor: pointer;
      }
      #topbar .tabs {
        display: inline-flex;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 7px;
        overflow: hidden;
        font: 500 11px var(--sans);
        margin-left: 8px;
      }
      #topbar .tabs a,
      #topbar .tabs span {
        padding: 4px 12px;
        color: var(--text-3);
        text-decoration: none;
      }
      #topbar .tabs .active {
        background: var(--panel-hover);
        color: var(--text);
      }
      #save-state {
        margin-left: auto;
        font: 500 10.5px var(--mono);
        color: var(--text-3);
      }
      #save-state.dirty {
        color: var(--orange);
      }

      /* outline rail */
      #outline {
        grid-area: outline;
        background: var(--bg-side);
        border-right: 1px solid var(--border);
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        overflow-y: auto;
      }
      #outline .head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        padding: 0 6px 6px;
      }
      .o-kind {
        padding: 4px 8px;
        border-radius: 6px;
        font: 500 11.5px var(--sans);
        color: var(--text-2);
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .o-kind:hover {
        background: var(--panel-hover);
      }
      .o-kind .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
      }
      .o-kind .count {
        margin-left: auto;
        font: 500 9.5px var(--mono);
        color: var(--text-4);
      }
      .o-item {
        padding: 3px 8px 3px 22px;
        border-radius: 6px;
        font: 500 11px var(--sans);
        color: var(--text-3);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .o-item:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      .o-item.current {
        background: var(--panel-hover);
        color: var(--text);
        font-weight: 600;
      }
      /* SB-069: character × key-type group header inside the Thoughts kind */
      .o-sub {
        padding: 5px 8px 2px 14px;
        font: 600 9.5px var(--mono);
        letter-spacing: 0.06em;
        color: var(--text-4);
        text-transform: uppercase;
      }
      #outline .legend {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding: 8px 6px 0;
      }
      #outline .legend .head {
        padding: 0 0 5px;
      }
      #outline .legend .body {
        font: 400 10px/1.7 var(--mono);
        color: var(--text-3);
      }

      /* editor — CodeMirror host */
      #editor-pane {
        grid-area: editor;
        position: relative;
        background: var(--surface-code);
        overflow: hidden;
        min-width: 0;
      }
      #editor-pane .cm-editor {
        height: 100%;
      }
      #editor-pane .cm-editor.cm-focused {
        outline: none;
      }

      /* lens token classes: shared/lens-tokens.css (imported by main.ts) */

      /* hover tooltips */
      .kv-tip {
        max-width: 340px;
        padding: 8px 11px;
        font: 400 11px/1.55 var(--sans);
      }
      .kv-tip-title {
        font: 600 10.5px var(--mono);
        color: var(--text);
        margin-bottom: 3px;
      }
      .kv-tip-body {
        color: var(--text-2);
      }

      /* right rail: preview + problems */
      #rail {
        grid-area: rail;
        background: var(--bg-rail);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .rail-head {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .rail-head .t {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
      }
      .rail-head .sub {
        margin-left: auto;
        font: 400 10px var(--mono);
        color: var(--text-4);
      }
      #preview {
        flex: 1 1 55%;
        padding: 14px 18px;
        overflow-y: auto;
        min-height: 0;
      }
      #preview .funn-meta {
        margin-top: 12px;
      }
      #preview .fc-rel {
        margin-top: 10px;
      }
      #preview .fc-rel h4 {
        font-family: 'Architects Daughter', cursive;
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-3);
        margin: 0 0 4px;
      }
      #preview .fc-link {
        display: block;
        font: 400 11.5px/1.5 var(--sans);
        color: var(--text-2);
        padding: 3px 0;
        border-bottom: 1px dashed var(--border-2);
        cursor: pointer;
      }
      #preview .fc-link:hover {
        color: var(--gold);
      }
      #preview .fc-link.dead {
        color: var(--text-4);
        cursor: default;
      }
      #preview .feeds-head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin: 12px 0 6px;
      }
      #preview .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #preview .chip {
        font: 500 10px var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
        border: 1px solid var(--border-2);
        color: var(--text-2);
      }
      #preview .node-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      #preview .node-kind {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.08em;
      }
      #preview .node-id {
        font: 600 12px var(--mono);
        color: var(--text);
        margin-top: 4px;
      }
      #preview .node-json {
        font: 400 10.5px/1.7 var(--mono);
        color: var(--text-2);
        margin-top: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* SB-069: Thoughts/Barks in-game-form sketches (doc-preview doctrine:
         honest about shape — icon, text, speaker — not Godot renders) */
      #preview .tv-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 14px 10px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      #preview .tv-bubble {
        max-width: 85%;
        padding: 8px 14px;
        background: var(--paper);
        color: var(--ink);
        border-radius: 14px;
        font: 400 12.5px/1.45 var(--hand-1);
        text-align: center;
      }
      #preview .tv-thought {
        border-radius: 50% / 46%;
        padding: 12px 20px;
      }
      #preview .tv-speech {
        position: relative;
        margin-bottom: 12px;
      }
      #preview .tv-speech::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -8px;
        margin-left: -6px;
        border: 6px solid transparent;
        border-top-color: var(--paper);
        border-bottom: none;
      }
      #preview .tv-icon {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.04em;
        color: var(--ink-dim);
        border: 1px dashed var(--ink-faint);
        border-radius: 6px;
        padding: 3px 7px;
      }
      #preview .tv-icon-fallback {
        margin-left: 6px;
        font: 500 8.5px var(--mono);
        color: var(--hint-warn);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #preview .tv-dots {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      #preview .tv-dots span {
        border-radius: 50%;
        background: var(--paper);
      }
      #preview .tv-dots span:first-child {
        width: 8px;
        height: 8px;
      }
      #preview .tv-dots span:last-child {
        width: 5px;
        height: 5px;
      }
      #preview .tv-figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 4px;
      }
      #preview .tv-figure-head {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--text-4);
      }
      #preview .tv-figure-body {
        width: 46px;
        height: 26px;
        border-radius: 12px 12px 4px 4px;
        background: var(--text-4);
        margin-top: 2px;
        opacity: 0.7;
      }
      #preview .tv-figure-name {
        margin-top: 5px;
        font: 500 10px var(--mono);
        color: var(--text-3);
      }
      #preview .tv-feed-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 2px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--purple);
        border-radius: 8px;
      }
      #preview .tv-feed-icon {
        flex: none;
        font: 500 9px var(--mono);
        color: var(--text-4);
      }
      #preview .tv-feed-text {
        font: 400 12px/1.5 var(--sans);
        color: var(--text);
      }
      #preview .tv-feed-meta {
        margin-left: auto;
        flex: none;
        font: 400 9px var(--mono);
        color: var(--text-4);
      }
      #preview .tv-feed-empty {
        color: var(--text-4);
        font-style: italic;
      }
      #preview .tv-cycle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      #preview .tv-cycle-btn {
        font: 500 10.5px var(--sans);
        color: var(--text-2);
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 7px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #preview .tv-cycle-btn:hover:not(:disabled) {
        background: var(--panel-hover);
        color: var(--text);
      }
      #preview .tv-cycle-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #preview .tv-cycle-count {
        font: 400 10px var(--mono);
        color: var(--text-3);
      }
      #preview .tv-stub-chip {
        margin-left: 8px;
        color: var(--orange);
        border-color: rgba(240, 136, 62, 0.35);
        background: var(--tint-orange);
      }
      /* SB-070: Visit storyboard strip (doc-preview doctrine: honest about
         speaker, room, timing — not a Godot render) */
      #preview .vv-catalog {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      #preview .vv-name {
        font: 600 13px var(--sans);
        color: var(--text);
      }
      #preview .vv-blurb {
        font: 400 11px/1.5 var(--sans);
        color: var(--text-2);
        margin-top: 3px;
      }
      #preview .vv-offer {
        font: 400 11px/1.5 var(--hand-1);
        color: var(--text-2);
        margin-top: 7px;
      }
      #preview .vv-offer-k {
        font: 600 9px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-4);
        margin-right: 5px;
      }
      #preview .vv-unlocks {
        font: 400 10px var(--mono);
        color: var(--text-4);
        margin-top: 6px;
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      #preview .vv-unlocks .fc-link {
        display: inline;
        border-bottom: none;
        padding: 0;
        color: var(--yellow);
      }
      #preview .vv-strip {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 2px 10px;
      }
      #preview .vv-card {
        flex: none;
        width: 168px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      #preview .vv-card.vv-active {
        border-color: var(--green);
        box-shadow: 0 0 0 1px var(--green);
      }
      #preview .vv-card-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      #preview .vv-speaker {
        font: 600 10.5px var(--mono);
        color: var(--text);
      }
      #preview .vv-time {
        margin-left: auto;
        font: 400 9px var(--mono);
        color: var(--text-4);
      }
      #preview .vv-flag {
        font: 500 8.5px var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--orange);
      }
      #preview .vv-bubble {
        margin-top: 7px;
        padding: 7px 10px;
        background: var(--paper);
        color: var(--ink);
        border-radius: 10px;
        font: 400 11.5px/1.4 var(--hand-1);
      }
      #preview .vv-move-card {
        background: var(--bg-side);
        border-style: dashed;
      }
      #preview .vv-move-label {
        margin-top: 7px;
        font: 400 11px/1.4 var(--sans);
        color: var(--text-2);
        font-style: italic;
      }
      #preview .vv-rooms {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font: 500 10px var(--mono);
        color: var(--text-2);
      }
      #preview .vv-arrow {
        color: var(--green);
        font-size: 13px;
      }
      #preview .vv-card-foot {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 7px;
      }
      #preview .vv-dwell {
        font: 400 9.5px var(--mono);
        color: var(--text-3);
      }
      #preview .vv-beat {
        margin-left: auto;
        font: 500 9px var(--mono);
        color: var(--gold);
      }
      #preview .vv-fork {
        flex: none;
        border-left: 2px solid var(--yellow);
        border-radius: 4px;
        padding: 4px 0 4px 8px;
      }
      #preview .vv-fork-guard {
        font: 500 9.5px var(--mono);
        color: var(--yellow);
        margin-bottom: 5px;
      }
      #preview .vv-fork-lane {
        display: flex;
        gap: 8px;
      }
      #preview .vv-fork-skip {
        margin-top: 5px;
        font: 400 9px var(--mono);
        color: var(--text-4);
        font-style: italic;
      }
      #preview .vv-empty {
        font: 400 11.5px var(--sans);
        color: var(--text-4);
        font-style: italic;
        padding: 14px 4px;
      }
      #preview .vv-scrub {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      #preview .vv-scrub-range {
        flex: 1 1 auto;
        accent-color: var(--green);
      }
      #preview .vv-scrub-label {
        flex: none;
        font: 400 10px var(--mono);
        color: var(--text-3);
      }
      #preview .empty {
        font: 400 11.5px var(--sans);
        color: var(--text-4);
        padding: 20px 4px;
      }
      #problems {
        flex: 1 1 45%;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #problem-list {
        overflow-y: auto;
        padding: 6px 8px;
        min-height: 0;
      }
      .prob {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        font: 400 11px var(--mono);
        color: var(--text-2);
      }
      .prob:hover {
        background: var(--panel-hover);
      }
      .prob .sev {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        align-self: center;
      }
      .prob .line {
        flex: none;
        color: var(--text-4);
        width: 52px;
      }
      .prob .msg {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sev-error {
        background: var(--danger);
      }
      .sev-warning {
        background: var(--orange);
      }
      .sev-info {
        background: var(--blue);
      }
      .sev-advisory {
        background: var(--text-4);
      }

      /* status bar */
      #statusbar {
        grid-area: status;
        background: var(--bg-side);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        font: 500 10px var(--mono);
        overflow: hidden;
        white-space: nowrap;
      }
      #statusbar .ok {
        color: var(--green);
      }
      #statusbar .todo-c {
        color: var(--orange);
      }
      #statusbar .stub-c {
        color: var(--danger);
      }
      #statusbar .warn-c {
        color: var(--orange);
      }
      #statusbar .adv-c {
        color: var(--text-3);
      }
      #statusbar .hint {
        margin-left: auto;
        color: var(--text-4);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="logo"></span>
        <span class="name">Kildeverket</span>
        <select id="case-picker" class="file" title="active case"></select>
        <span class="tabs">
          <span class="active">Script</span>
          <a href="../canvas/" title="canvas lens">Canvas</a>
          <span title="not built — behind the fog">Pacing</span>
          <a href="../playtest/" title="playtest lens">Playtest</a>
        </span>
        <span id="save-state">loaded</span>
      </div>
      <div id="outline"></div>
      <div id="editor-pane"></div>
      <div id="rail">
        <div class="rail-head">
          <span class="t" id="preview-title">PREVIEW</span>
          <span class="sub">follows cursor</span>
        </div>
        <div id="preview" class="surface"></div>
        <div id="problems">
          <div class="rail-head">
            <span class="t">PROBLEMS</span>
            <span class="sub" id="problem-count"></span>
          </div>
          <div id="problem-list"></div>
        </div>
      </div>
      <div id="statusbar"></div>
    </div>
    <div id="doc-lightbox"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
