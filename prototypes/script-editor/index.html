<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kildeverket — script editor probe</title>
    <style>
      /* Fonts arrive at runtime: main.ts injects @font-face for the bake TTFs
         (templates/docs/fonts) so the rail uses the exact in-game families. */
      /* PM Board tokens (extracted from the handoff design system) */
      /* PM Board tokens live in prototypes/shared/surfaces.css (SB-082);
         only the script-page extras stay here. */
      :root {
        --bg-rail: #111218;
        --tint-danger: rgba(229, 72, 77, 0.12);
        /* paper/ink tokens from prototypes/blueprint_v1.html — the game surface */
        --paper: #f5f1e8;
        --paper-shade: #ece7d8;
        --ink: #2a2520;
        --ink-dim: #6b6259;
        --ink-faint: #a49a8c;
        --hint-gold: #c89a2e;
        --hint-warn: #c86244;
        --hint-green: #7aa66f;
        --hint-blue: #5b7fc4;
        --hint-purple: #a57bc2;
        --mark: #fff8b0;
        --hand-1: 'Kalam', cursive;
        --hand-2: 'Caveat', cursive;
        --hand-3: 'Architects Daughter', cursive;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: 44px 1fr 28px;
        grid-template-columns: 220px 1fr 400px;
        grid-template-areas:
          'top top top'
          'outline editor rail'
          'status status status';
        height: 100vh;
      }

      /* top bar */
      #topbar {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-side);
      }
      #topbar .logo {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: linear-gradient(135deg, #7b83eb, #4c56c0);
      }
      #topbar .name {
        font: 600 12.5px var(--sans);
      }
      #topbar .file {
        font: 500 10.5px var(--mono);
        color: var(--text-3);
        background: none;
        border: none;
        cursor: pointer;
      }
      #topbar .tabs {
        display: inline-flex;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 7px;
        overflow: hidden;
        font: 500 11px var(--sans);
        margin-left: 8px;
      }
      #topbar .tabs a,
      #topbar .tabs span {
        padding: 4px 12px;
        color: var(--text-3);
        text-decoration: none;
      }
      #topbar .tabs .active {
        background: var(--panel-hover);
        color: var(--text);
      }
      #save-state {
        margin-left: auto;
        font: 500 10.5px var(--mono);
        color: var(--text-3);
      }
      #save-state.dirty {
        color: var(--orange);
      }

      /* outline rail */
      #outline {
        grid-area: outline;
        background: var(--bg-side);
        border-right: 1px solid var(--border);
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        overflow-y: auto;
      }
      #outline .head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        padding: 0 6px 6px;
      }
      .o-kind {
        padding: 4px 8px;
        border-radius: 6px;
        font: 500 11.5px var(--sans);
        color: var(--text-2);
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .o-kind:hover {
        background: var(--panel-hover);
      }
      .o-kind .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
      }
      .o-kind .count {
        margin-left: auto;
        font: 500 9.5px var(--mono);
        color: var(--text-4);
      }
      .o-item {
        padding: 3px 8px 3px 22px;
        border-radius: 6px;
        font: 500 11px var(--sans);
        color: var(--text-3);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .o-item:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      .o-item.current {
        background: var(--panel-hover);
        color: var(--text);
        font-weight: 600;
      }
      #outline .legend {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding: 8px 6px 0;
      }
      #outline .legend .head {
        padding: 0 0 5px;
      }
      #outline .legend .body {
        font: 400 10px/1.7 var(--mono);
        color: var(--text-3);
      }

      /* editor — CodeMirror host */
      #editor-pane {
        grid-area: editor;
        position: relative;
        background: var(--surface-code);
        overflow: hidden;
        min-width: 0;
      }
      #editor-pane .cm-editor {
        height: 100%;
      }
      #editor-pane .cm-editor.cm-focused {
        outline: none;
      }

      /* token classes (built by the classifier in main.ts) */
      .tok-h-doc {
        color: var(--blue);
        font-weight: 600;
      }
      .tok-h-fact {
        color: var(--accent);
        font-weight: 600;
      }
      .tok-h-question {
        color: var(--yellow);
        font-weight: 600;
      }
      .tok-h-hypothesis {
        color: var(--purple);
        font-weight: 600;
      }
      .tok-h-tiltak {
        color: var(--green);
        font-weight: 600;
      }
      .tok-h-dispatch {
        color: var(--orange);
        font-weight: 600;
      }
      .tok-h-clock {
        color: var(--gold);
        font-weight: 600;
      }
      .tok-h-case {
        color: var(--text);
        font-weight: 600;
      }
      .tok-key {
        color: var(--text-3);
      }
      .tok-key-gate {
        color: var(--yellow);
      }
      .tok-key-needs {
        color: var(--purple);
      }
      .tok-key-opens {
        color: var(--green);
      }
      .tok-id-doc {
        color: var(--blue);
      }
      .tok-id-fact {
        color: var(--accent);
      }
      .tok-id-question {
        color: var(--yellow);
      }
      .tok-id-hypothesis {
        color: var(--purple);
      }
      .tok-id-tiltak {
        color: var(--green);
      }
      .tok-id-dispatch {
        color: var(--orange);
      }
      .tok-id-clock {
        color: var(--gold);
      }
      .tok-anchor-text {
        background: var(--tint-accent);
        border-radius: 3px;
      }
      .tok-anchor-ref {
        color: var(--accent);
      }
      .tok-quote {
        color: var(--text-2);
        font-style: italic;
      }
      .tok-comment {
        color: var(--text-4);
        font-style: italic;
      }
      .tok-effect {
        color: var(--green);
        font-weight: 600;
      }
      .tok-weave {
        color: var(--purple);
        font-weight: 600;
      }
      .tok-guard {
        color: var(--yellow);
      }
      .tok-kw {
        color: var(--text-2);
        font-weight: 600;
      }
      .tok-icon {
        color: var(--gold);
      }
      .tok-todo {
        background: var(--tint-orange);
      }
      .tok-todo,
      .tok-todo * {
        color: var(--orange);
      }

      /* ⌘ held: ids advertise goto-definition */
      body.goto-mode [class*='tok-id-'] {
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      /* hover tooltips */
      .kv-tip {
        max-width: 340px;
        padding: 8px 11px;
        font: 400 11px/1.55 var(--sans);
      }
      .kv-tip-title {
        font: 600 10.5px var(--mono);
        color: var(--text);
        margin-bottom: 3px;
      }
      .kv-tip-body {
        color: var(--text-2);
      }

      /* right rail: preview + problems */
      #rail {
        grid-area: rail;
        background: var(--bg-rail);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .rail-head {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .rail-head .t {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
      }
      .rail-head .sub {
        margin-left: auto;
        font: 400 10px var(--mono);
        color: var(--text-4);
      }
      #preview {
        flex: 1 1 55%;
        padding: 14px 18px;
        overflow-y: auto;
        min-height: 0;
      }
      #preview .funn-meta {
        margin-top: 12px;
      }
      #preview .fc-rel {
        margin-top: 10px;
      }
      #preview .fc-rel h4 {
        font-family: 'Architects Daughter', cursive;
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-3);
        margin: 0 0 4px;
      }
      #preview .fc-link {
        display: block;
        font: 400 11.5px/1.5 var(--sans);
        color: var(--text-2);
        padding: 3px 0;
        border-bottom: 1px dashed var(--border-2);
        cursor: pointer;
      }
      #preview .fc-link:hover {
        color: var(--gold);
      }
      #preview .fc-link.dead {
        color: var(--text-4);
        cursor: default;
      }
      #preview .feeds-head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin: 12px 0 6px;
      }
      #preview .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #preview .chip {
        font: 500 10px var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
        border: 1px solid var(--border-2);
        color: var(--text-2);
      }
      #preview .node-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      #preview .node-kind {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.08em;
      }
      #preview .node-id {
        font: 600 12px var(--mono);
        color: var(--text);
        margin-top: 4px;
      }
      #preview .node-json {
        font: 400 10.5px/1.7 var(--mono);
        color: var(--text-2);
        margin-top: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #preview .empty {
        font: 400 11.5px var(--sans);
        color: var(--text-4);
        padding: 20px 4px;
      }
      #problems {
        flex: 1 1 45%;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #problem-list {
        overflow-y: auto;
        padding: 6px 8px;
        min-height: 0;
      }
      .prob {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        font: 400 11px var(--mono);
        color: var(--text-2);
      }
      .prob:hover {
        background: var(--panel-hover);
      }
      .prob .sev {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        align-self: center;
      }
      .prob .line {
        flex: none;
        color: var(--text-4);
        width: 52px;
      }
      .prob .msg {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sev-error {
        background: var(--danger);
      }
      .sev-warning {
        background: var(--orange);
      }
      .sev-info {
        background: var(--blue);
      }
      .sev-advisory {
        background: var(--text-4);
      }

      /* status bar */
      #statusbar {
        grid-area: status;
        background: var(--bg-side);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        font: 500 10px var(--mono);
        overflow: hidden;
        white-space: nowrap;
      }
      #statusbar .ok {
        color: var(--green);
      }
      #statusbar .todo-c {
        color: var(--orange);
      }
      #statusbar .stub-c {
        color: var(--danger);
      }
      #statusbar .warn-c {
        color: var(--orange);
      }
      #statusbar .adv-c {
        color: var(--text-3);
      }
      #statusbar .hint {
        margin-left: auto;
        color: var(--text-4);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="logo"></span>
        <span class="name">Kildeverket</span>
        <select id="case-picker" class="file" title="active case"></select>
        <span class="tabs">
          <span class="active">Script</span>
          <a href="../canvas/" title="canvas lens">Canvas</a>
          <span title="not built — behind the fog">Pacing</span>
          <span title="not built">Playtest</span>
        </span>
        <span id="save-state">loaded</span>
      </div>
      <div id="outline"></div>
      <div id="editor-pane"></div>
      <div id="rail">
        <div class="rail-head">
          <span class="t" id="preview-title">PREVIEW</span>
          <span class="sub">follows cursor</span>
        </div>
        <div id="preview" class="surface"></div>
        <div id="problems">
          <div class="rail-head">
            <span class="t">PROBLEMS</span>
            <span class="sub" id="problem-count"></span>
          </div>
          <div id="problem-list"></div>
        </div>
      </div>
      <div id="statusbar"></div>
    </div>
    <div id="doc-lightbox"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
