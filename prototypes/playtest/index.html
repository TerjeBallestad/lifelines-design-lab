<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kildeverket — playtest probe</title>
    <style>
      /* SB-061: the Playtest lens — a reader over the compiled case. Tokens
         live in prototypes/shared/surfaces.css (SB-082); only page extras
         stay here. Shell CSS mirrors the script-editor page. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: 44px 1fr;
        grid-template-columns: 300px 1fr;
        grid-template-areas:
          'top top'
          'index reading';
        height: 100vh;
      }

      /* top bar (lens idiom) */
      #topbar {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-side);
      }
      #topbar .logo {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: linear-gradient(135deg, #7b83eb, #4c56c0);
      }
      #topbar .name {
        font: 600 12.5px var(--sans);
      }
      #topbar .file {
        font: 500 10.5px var(--mono);
        color: var(--text-3);
        background: none;
        border: none;
        cursor: pointer;
      }
      #topbar .tabs {
        display: inline-flex;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 7px;
        overflow: hidden;
        font: 500 11px var(--sans);
        margin-left: 8px;
      }
      #topbar .tabs a,
      #topbar .tabs span {
        padding: 4px 12px;
        color: var(--text-3);
        text-decoration: none;
      }
      #topbar .tabs .active {
        background: var(--panel-hover);
        color: var(--text);
      }
      #case-note {
        margin-left: auto;
        font: 500 10.5px var(--mono);
        color: var(--text-3);
      }

      /* entity index — every emitted entity, grouped by kind */
      #index {
        grid-area: index;
        background: var(--bg-side);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 12px 10px;
      }
      #index .idx-group {
        margin-bottom: 10px;
      }
      #index .idx-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-4);
        padding: 0 6px 4px;
      }
      #index .idx-head .count {
        margin-left: auto;
        font: 500 9.5px var(--mono);
        color: var(--text-4);
      }
      #index .idx-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 3px 8px;
        border-radius: 6px;
        font: 500 11px var(--sans);
        color: var(--text-3);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #index .idx-item:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      #index .idx-item.current {
        background: var(--panel-hover);
        color: var(--text);
        font-weight: 600;
      }

      /* reading pane — the player surface at full reading size */
      #reading {
        grid-area: reading;
        overflow-y: auto;
        padding: 22px 28px 60px;
      }
      #reading .read-head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin-bottom: 12px;
      }
      #surface {
        max-width: 760px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="logo"></span>
        <span class="name">Kildeverket</span>
        <select id="case-picker" class="file" title="active case"></select>
        <span class="tabs">
          <a href="../script-editor/" title="script lens">Script</a>
          <a href="../canvas/" title="canvas lens">Canvas</a>
          <span title="not built — behind the fog">Pacing</span>
          <span class="active">Playtest</span>
        </span>
        <span id="case-note"></span>
      </div>
      <div id="index"></div>
      <div id="reading">
        <div class="read-head" id="surface-title">GAME SURFACE</div>
        <!-- SB-082 lesson: lit owns this host from boot — it stays empty here -->
        <div id="surface" class="surface"></div>
      </div>
    </div>
    <div id="doc-lightbox"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
