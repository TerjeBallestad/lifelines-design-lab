<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kildeverket — editor (script + canvas)</title>
    <style>
      /* PM Board tokens — same set as prototypes/script-editor */
      :root {
        --bg: #0f1014;
        --bg-side: #121318;
        --panel: #15161b;
        --panel-hover: #1b1d24;
        --input: #191b21;
        --input-border: #22252f;
        --border: #1f222b;
        --border-2: #262933;
        --text: #e6e7ec;
        --text-2: #9b9fad;
        --text-3: #62667a;
        --text-4: #4a4e5e;
        --accent: #7b83eb;
        --blue: #52a9ff;
        --green: #46c288;
        --orange: #f0883e;
        --purple: #c084fc;
        --yellow: #e2c541;
        --danger: #e5484d;
        --gold: #d3b078;
        --teal: #45c4b8; /* SB-046: the weave family (conversation/recipe/proposal) */
        /* SB-041 script lens tokens — same values as prototypes/script-editor */
        --surface-code: #0d0e12;
        --text-prose: #c9cbd4;
        --tint-accent: rgba(123, 131, 235, 0.1);
        --tint-orange: rgba(240, 136, 62, 0.09);
        --tint-yellow: rgba(226, 197, 65, 0.1);
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        overflow: hidden;
      }
      /* SB-041 hybrid layout: script pane | canvas | right rail.
         SB-055: the rail is preview (game surface) over inspector — 360px so
         the FUNN card and doc sheets stay readable at rail scale. */
      #app {
        display: grid;
        grid-template-rows: 44px 1fr 28px;
        grid-template-columns: minmax(320px, 30%) 1fr 360px;
        grid-template-areas:
          'top top top'
          'script canvas inspector'
          'status status status';
        height: 100vh;
      }
      #app.script-collapsed {
        grid-template-columns: 0 1fr 360px;
      }
      #app.script-collapsed #script-pane {
        display: none;
      }

      /* top bar — same strip as the script probe, Canvas active */
      #topbar {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-side);
      }
      #topbar .logo {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: linear-gradient(135deg, #7b83eb, #4c56c0);
      }
      #topbar .name {
        font: 600 12.5px var(--sans);
      }
      #topbar .file {
        font: 500 10.5px var(--mono);
        color: var(--text-3);
      }
      #topbar .tabs {
        display: inline-flex;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 7px;
        overflow: hidden;
        font: 500 11px var(--sans);
        margin-left: 8px;
      }
      #topbar .tabs a,
      #topbar .tabs span {
        padding: 4px 12px;
        color: var(--text-3);
        text-decoration: none;
      }
      #topbar .tabs .active {
        background: var(--panel-hover);
        color: var(--text);
      }
      #counts {
        margin-left: auto;
        font: 500 10.5px var(--mono);
        color: var(--text-3);
      }

      /* topbar script-pane toggle (SB-041) + worklist toggle (SB-044) */
      #toggle-script,
      #toggle-worklist {
        all: unset;
        padding: 4px 10px;
        border: 1px solid var(--input-border);
        border-radius: 7px;
        background: var(--input);
        color: var(--text-2);
        font: 500 11px var(--sans);
        cursor: pointer;
      }
      #toggle-script:hover,
      #toggle-worklist:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      #toggle-worklist.has-loose {
        color: var(--orange);
      }

      /* SB-044 loose-end worklist panel — overlays the canvas, top right */
      #worklist {
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 6;
        width: 320px;
        max-height: calc(100% - 66px);
        display: none;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #worklist.show {
        display: flex;
      }
      #worklist .head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        padding: 9px 12px 2px;
      }
      #worklist-body {
        overflow-y: auto;
        padding: 0 8px 8px;
      }
      #worklist-body .empty {
        font: 400 11px var(--sans);
        color: var(--text-4);
        padding: 6px 4px 2px;
      }
      #worklist .sect {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin: 10px 4px 3px;
      }
      #worklist .wl-row {
        font: 400 10px/1.5 var(--mono);
        color: var(--text-2);
        border-left: 2px solid var(--text-4);
        padding: 3px 6px 3px 7px;
        margin-top: 3px;
        border-radius: 0 5px 5px 0;
        cursor: pointer;
      }
      #worklist .wl-row:hover {
        background: var(--panel-hover);
      }
      #worklist .wl-row .dcode {
        display: block;
        font-weight: 600;
        color: var(--text-3);
      }
      #worklist .wl-row.s-error {
        border-left-color: var(--danger);
      }
      #worklist .wl-row.s-error .dcode {
        color: var(--danger);
      }
      #worklist .wl-row.s-warning {
        border-left-color: var(--orange);
      }
      #worklist .wl-row.s-warning .dcode {
        color: var(--orange);
      }
      #worklist .wl-row.s-advisory {
        border-left-color: var(--yellow);
      }

      /* script pane — CodeMirror lens host (SB-041), styling as the
         standalone script page's #editor-pane */
      #script-pane {
        grid-area: script;
        position: relative;
        background: var(--surface-code);
        border-right: 1px solid var(--border);
        overflow: hidden;
        min-width: 0;
      }
      #script-pane .cm-editor {
        height: 100%;
      }
      #script-pane .cm-editor.cm-focused {
        outline: none;
      }

      /* token classes (built by the lens classifier) */
      .tok-h-doc {
        color: var(--blue);
        font-weight: 600;
      }
      .tok-h-fact {
        color: var(--accent);
        font-weight: 600;
      }
      .tok-h-question {
        color: var(--yellow);
        font-weight: 600;
      }
      .tok-h-hypothesis {
        color: var(--purple);
        font-weight: 600;
      }
      .tok-h-tiltak {
        color: var(--green);
        font-weight: 600;
      }
      .tok-h-dispatch {
        color: var(--orange);
        font-weight: 600;
      }
      .tok-h-clock {
        color: var(--gold);
        font-weight: 600;
      }
      .tok-h-case {
        color: var(--text);
        font-weight: 600;
      }
      .tok-key {
        color: var(--text-3);
      }
      .tok-key-gate {
        color: var(--yellow);
      }
      .tok-key-needs {
        color: var(--purple);
      }
      .tok-key-opens {
        color: var(--green);
      }
      .tok-id-doc {
        color: var(--blue);
      }
      .tok-id-fact {
        color: var(--accent);
      }
      .tok-id-question {
        color: var(--yellow);
      }
      .tok-id-hypothesis {
        color: var(--purple);
      }
      .tok-id-tiltak {
        color: var(--green);
      }
      .tok-id-dispatch {
        color: var(--orange);
      }
      .tok-id-clock {
        color: var(--gold);
      }
      .tok-anchor-text {
        background: var(--tint-accent);
        border-radius: 3px;
      }
      .tok-anchor-ref {
        color: var(--accent);
      }
      .tok-quote {
        color: var(--text-2);
        font-style: italic;
      }
      .tok-comment {
        color: var(--text-4);
        font-style: italic;
      }
      .tok-effect {
        color: var(--green);
        font-weight: 600;
      }
      .tok-weave {
        color: var(--purple);
        font-weight: 600;
      }
      .tok-guard {
        color: var(--yellow);
      }
      .tok-kw {
        color: var(--text-2);
        font-weight: 600;
      }
      .tok-icon {
        color: var(--gold);
      }
      .tok-todo {
        background: var(--tint-orange);
      }
      .tok-todo,
      .tok-todo * {
        color: var(--orange);
      }

      /* ⌘ held: ids advertise goto-definition */
      body.goto-mode [class*='tok-id-'] {
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }

      /* lens hover tooltips */
      .kv-tip {
        max-width: 340px;
        padding: 8px 11px;
        font: 400 11px/1.55 var(--sans);
      }
      .kv-tip-title {
        font: 600 10.5px var(--mono);
        color: var(--text);
        margin-bottom: 3px;
      }
      .kv-tip-body {
        color: var(--text-2);
      }

      /* canvas viewport */
      #viewport {
        grid-area: canvas;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle, #1a1c22 1px, transparent 1px) 0 0 / 26px 26px,
          var(--bg);
        cursor: grab;
      }
      #viewport.panning {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
      #edges {
        position: absolute;
        top: 0;
        left: 0;
        overflow: visible;
        pointer-events: none;
      }
      #edges path {
        fill: none;
        stroke: var(--border-2);
        stroke-width: 1.2;
      }
      #edges path.lit {
        stroke-width: 1.8;
      }
      #edges text {
        font: 600 9px var(--mono);
        fill: var(--text-2);
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 3;
      }
      body.has-selection #edges path:not(.lit) {
        opacity: 0.18;
      }

      /* SB-033: edge authoring */
      #edges path.hit {
        stroke: transparent;
        stroke-width: 12;
        pointer-events: stroke;
        cursor: pointer;
        opacity: 1;
      }
      #edges path.edge-selected {
        stroke: var(--danger) !important;
        stroke-width: 2;
        opacity: 1 !important;
      }
      #edges path.rubber {
        stroke: var(--accent);
        stroke-width: 1.6;
        stroke-dasharray: 4 3;
        pointer-events: none;
      }
      #cursor-tip {
        position: fixed;
        z-index: 20;
        display: none;
        max-width: 300px;
        background: var(--panel);
        border: 1px solid var(--danger);
        border-radius: 6px;
        padding: 5px 8px;
        font: 500 10.5px var(--mono);
        color: var(--text);
        pointer-events: none;
      }
      #cursor-tip.show {
        display: block;
      }

      /* SB-042: drop-create menu — release a port drag on empty canvas */
      #create-menu {
        position: fixed;
        z-index: 21;
        display: none;
        flex-direction: column;
        min-width: 148px;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 7px;
        padding: 3px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #create-menu.show {
        display: flex;
      }
      #create-menu .cm-head {
        font: 600 8.5px var(--mono);
        letter-spacing: 0.07em;
        color: var(--text-4);
        padding: 4px 8px 3px;
      }
      #create-menu .cm-item {
        all: unset;
        padding: 4px 8px;
        border-radius: 5px;
        font: 600 10.5px var(--mono);
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      #create-menu .cm-item:hover {
        background: var(--panel-hover);
      }

      /* nodes */
      .node {
        position: absolute;
        width: 208px;
        height: 58px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-left-width: 3px;
        border-radius: 8px;
        cursor: pointer;
        overflow: hidden;
      }
      .node:hover {
        background: var(--panel-hover);
      }
      .node .nid {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.02em;
      }
      .node .ntitle {
        font: 500 11px/1.25 var(--sans);
        color: var(--text);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node .nsub {
        font: 400 9px var(--mono);
        color: var(--text-3);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      body.has-selection .node:not(.lit) {
        opacity: 0.22;
      }
      .node.selected {
        border-color: var(--text-2);
        box-shadow: 0 0 0 1px var(--text-2);
      }
      .node .port {
        position: absolute;
        right: 3px;
        top: 50%;
        transform: translateY(-50%);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--input);
        border: 1px solid var(--text-3);
        cursor: crosshair;
        opacity: 0;
      }
      .node:hover .port,
      .node.selected .port {
        opacity: 1;
      }
      .node .port:hover {
        border-color: var(--accent);
        background: var(--panel-hover);
      }

      /* SB-049: stub ghosts — named in the script, no block behind them */
      .node.stub {
        border-style: dashed;
        background: transparent;
      }
      .node.stub .ntitle {
        color: var(--text-3);
        font-style: italic;
      }
      .node.stub:hover {
        background: var(--panel);
      }

      /* per-kind color: left border + id */
      .k-document {
        border-left-color: var(--blue);
      }
      .k-document .nid {
        color: var(--blue);
      }
      .k-fact {
        border-left-color: var(--accent);
      }
      .k-fact .nid {
        color: var(--accent);
      }
      .k-question {
        border-left-color: var(--yellow);
      }
      .k-question .nid {
        color: var(--yellow);
      }
      .k-hypothesis {
        border-left-color: var(--purple);
      }
      .k-hypothesis .nid {
        color: var(--purple);
      }
      .k-tiltak {
        border-left-color: var(--green);
      }
      .k-tiltak .nid {
        color: var(--green);
      }
      .k-dispatch {
        border-left-color: var(--orange);
      }
      .k-dispatch .nid {
        color: var(--orange);
      }
      .k-clock {
        border-left-color: var(--gold);
      }
      .k-clock .nid {
        color: var(--gold);
      }
      /* SB-046: the weave family shares the teal hue */
      .k-conversation,
      .k-recipe,
      .k-proposal {
        border-left-color: var(--teal);
      }
      .k-conversation .nid,
      .k-recipe .nid,
      .k-proposal .nid {
        color: var(--teal);
      }

      /* zoom overlay + legend */
      #zoombar {
        position: absolute;
        left: 12px;
        bottom: 12px;
        display: flex;
        gap: 2px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 7px;
        padding: 2px;
        font: 500 10.5px var(--mono);
        z-index: 5;
      }
      #zoombar button {
        all: unset;
        padding: 3px 9px;
        border-radius: 5px;
        color: var(--text-2);
        cursor: pointer;
      }
      #zoombar button:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      #zoombar .pct {
        padding: 0 6px;
        color: var(--text-3);
        min-width: 40px;
        text-align: center;
      }
      /* SB-051: layout-mode toggle */
      #zoombar .zsep {
        width: 1px;
        height: 14px;
        background: var(--border-2);
        margin: 0 4px;
      }
      #zoombar button.active {
        background: var(--panel-hover);
        color: var(--text);
      }
      .node.pinned::after {
        content: '';
        position: absolute;
        top: 5px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
      }
      /* SB-051 feedback: the always-open strip was tiny, crowded, and sat on
         the zoombar. Now a chip that unfolds upward into a column on hover. */
      #legend {
        position: absolute;
        right: 12px;
        bottom: 12px;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 7px;
        padding: 4px 10px;
        font: 500 10.5px var(--mono);
        color: var(--text-3);
        z-index: 5;
      }
      #legend .ltag {
        cursor: default;
      }
      #legend .lbody {
        display: none;
        flex-direction: column;
        gap: 6px;
        padding: 6px 0 3px;
      }
      #legend:hover .lbody {
        display: flex;
      }
      #legend .lbody span {
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      #legend .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: 1px;
      }
      /* SB-039 port legend: the ring mirrors .port, the wire mirrors an edge */
      #legend .ring {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--input);
        border: 1px solid var(--text-3);
        margin-right: 4px;
        vertical-align: -1px;
      }
      #legend .wire {
        display: inline-block;
        width: 12px;
        height: 2px;
        background: var(--blue);
        margin-right: 4px;
        vertical-align: 2px;
      }

      /* right rail (SB-055): game-surface preview over the inspector */
      #rightrail {
        grid-area: inspector;
        background: var(--bg-side);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .rail-head {
        padding: 9px 16px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      .rail-head .t {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
      }
      #preview {
        flex: 0 1 auto;
        max-height: 52%;
        padding: 14px 16px;
        overflow-y: auto;
        min-height: 0;
        border-bottom: 1px solid var(--border);
      }
      #preview .empty {
        font: 400 11.5px var(--sans);
        color: var(--text-4);
        padding: 12px 2px;
      }
      #preview .surface-label {
        font: 600 8.5px var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-4);
        margin: 12px 0 6px;
      }
      #preview .surface-label:first-child {
        margin-top: 0;
      }
      /* FUNN card — the in-game desk fact card (hand_card.tscn grammar) */
      #preview .funn-card {
        background: #f2ecdd;
        border: 2px solid #2a2520;
        border-radius: 3px;
        box-shadow: 5px 6px 0 rgba(0, 0, 0, 0.45);
        padding: 14px 16px 16px;
        color: #2a2520;
      }
      #preview .funn-card .funn-rule {
        height: 5px;
        background: #b8442c;
        margin-bottom: 10px;
      }
      #preview .funn-card .funn-stamp {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #b8442c;
        margin-bottom: 6px;
      }
      #preview .funn-card .funn-quote {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: 19px;
        line-height: 1.28;
        letter-spacing: -0.01em;
      }
      #preview .funn-card .funn-source {
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-size: 12.5px;
        color: #6b6259;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1.5px solid #2a2520;
      }
      /* detail panel — canvas_detail_panel.gd's paper record (FAKTUM/TOLKNING) */
      #preview .detail-panel {
        background: #f2ecdd;
        border: 2px solid #2a2520;
        border-radius: 3px;
        box-shadow: 5px 6px 0 rgba(0, 0, 0, 0.45);
        padding: 12px 14px 14px;
        color: #2a2520;
      }
      #preview .detail-panel .dp-kind {
        font-family: 'Architects Daughter', cursive;
        font-size: 9.5px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #b8442c;
      }
      #preview .detail-panel .dp-title {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.3;
        margin-top: 4px;
      }
      #preview .detail-panel .dp-meta {
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-size: 11px;
        color: #6b6259;
        margin-top: 5px;
      }
      #preview .detail-panel .dp-body {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 12.5px;
        line-height: 1.5;
        margin-top: 8px;
      }
      #preview .detail-panel .dp-quote {
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-size: 12px;
        line-height: 1.45;
        color: #4a423a;
        margin-top: 8px;
        padding-left: 9px;
        border-left: 2.5px solid #b8442c;
      }
      #preview .detail-panel .dp-extra {
        font-family: 'Architects Daughter', cursive;
        font-size: 11px;
        line-height: 1.6;
        color: #4a423a;
        margin-top: 9px;
        padding-top: 7px;
        border-top: 1.5px solid #2a2520;
        white-space: pre-line;
      }
      /* Frank's line when the card is played */
      #preview .frank-line {
        font: 400 italic 11.5px/1.55 var(--sans);
        color: var(--text-2);
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 8px 8px 8px 2px;
        padding: 8px 11px;
      }
      /* real bake template preview — iframe scaled to the rail */
      #preview .doc-frame-wrap {
        overflow: hidden;
        border-radius: 3px;
        box-shadow: 5px 6px 0 rgba(0, 0, 0, 0.45);
      }
      #preview .doc-frame-wrap iframe {
        border: 0;
        display: block;
        transform-origin: top left;
        pointer-events: auto;
      }
      #preview .lb-hint {
        font: 400 9.5px var(--mono);
        color: var(--text-4);
        margin-top: 6px;
      }
      #preview .node-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      #preview .node-json {
        font: 400 10.5px/1.7 var(--mono);
        color: var(--text-2);
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* readable full-size document view (click the page to open) */
      #doc-lightbox {
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 9, 0.72);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 4vh 4vw;
        z-index: 90;
        cursor: zoom-out;
      }
      #doc-lightbox.open {
        display: flex;
      }
      #doc-lightbox .lb-inner {
        max-height: 92vh;
        overflow-y: auto;
        overflow-x: hidden;
        border-radius: 3px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        cursor: default;
      }
      #doc-lightbox .lb-inner iframe {
        border: 0;
        display: block;
        transform-origin: top left;
      }

      /* inspector — the rail's lower half */
      #inspector {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 16px 14px;
        min-height: 0;
      }
      #inspector .head {
        font: 600 10.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin-bottom: 10px;
      }
      /* SB-055: the computed "what opens this?" sentence */
      #inspector .unlock {
        font: 400 11px/1.55 var(--sans);
        color: var(--text-2);
        border-left: 2px solid var(--green);
        padding-left: 8px;
      }
      #inspector .empty {
        font: 400 11.5px var(--sans);
        color: var(--text-4);
      }
      #inspector .kind {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.08em;
      }
      #inspector .iid {
        font: 600 12px var(--mono);
        color: var(--text);
        margin-top: 4px;
      }
      #inspector .ititle {
        font: 500 12.5px var(--sans);
        color: var(--text);
        margin-top: 6px;
      }
      #inspector .isub {
        font: 400 11px/1.55 var(--sans);
        color: var(--text-2);
        margin-top: 6px;
      }
      #inspector .sect {
        font: 600 9.5px var(--mono);
        letter-spacing: 0.08em;
        color: var(--text-4);
        margin: 14px 0 5px;
      }
      #inspector .rel {
        display: flex;
        gap: 7px;
        align-items: baseline;
        padding: 3px 6px;
        margin: 0 -6px;
        border-radius: 6px;
        font: 500 10.5px var(--mono);
        cursor: pointer;
      }
      #inspector .rel:hover {
        background: var(--panel-hover);
      }
      #inspector .rel .via {
        color: var(--text-4);
        font-size: 9px;
        min-width: 52px;
      }
      #inspector .rel .rtitle {
        color: var(--text-2);
        font: 400 10.5px var(--sans);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* inspector edit form (SB-032) */
      #inspector .field {
        display: block;
        margin-top: 7px;
      }
      #inspector .fkey {
        display: block;
        font: 600 9px var(--mono);
        letter-spacing: 0.06em;
        color: var(--text-3);
        margin-bottom: 3px;
      }
      #inspector .fval {
        width: 100%;
        background: var(--input);
        border: 1px solid var(--input-border);
        border-radius: 6px;
        color: var(--text);
        font: 400 11px/1.45 var(--sans);
        padding: 5px 7px;
        resize: vertical;
      }
      #inspector .fval:focus {
        outline: none;
        border-color: var(--accent);
      }
      #inspector .form-note {
        font: 400 10px var(--mono);
        color: var(--orange);
        margin-top: 6px;
        min-height: 0;
        white-space: pre-wrap;
      }
      /* lifecycle action buttons (SB-034) */
      #inspector .iactions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #inspector .iactions.wrap {
        flex-wrap: wrap;
      }
      #inspector .ibtn {
        all: unset;
        padding: 4px 10px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--input);
        color: var(--text-2);
        font: 500 10.5px var(--mono);
        cursor: pointer;
      }
      #inspector .ibtn:hover {
        background: var(--panel-hover);
        color: var(--text);
      }
      #inspector .ibtn.danger {
        color: var(--danger);
        border-color: var(--danger);
      }

      #inspector .diag {
        font: 400 10px/1.5 var(--mono);
        color: var(--text-2);
        padding: 3px 0;
        border-left: 2px solid var(--text-4);
        padding-left: 7px;
        margin-top: 4px;
      }
      #inspector .diag .dcode {
        display: block;
        font-weight: 600;
        color: var(--text-3);
      }
      #inspector .diag.s-error {
        border-left-color: var(--danger);
      }
      #inspector .diag.s-error .dcode {
        color: var(--danger);
      }
      #inspector .diag.s-warning {
        border-left-color: var(--orange);
      }
      #inspector .diag.s-warning .dcode {
        color: var(--orange);
      }
      #inspector .diag.s-advisory {
        border-left-color: var(--yellow);
      }

      /* ⌘K jump palette (SB-055 follow-up) */
      #jump {
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 9, 0.55);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding-top: 12vh;
        z-index: 95;
      }
      #jump.open {
        display: flex;
      }
      #jump .jump-box {
        width: 480px;
        max-width: 90vw;
        background: var(--panel);
        border: 1px solid var(--border-2);
        border-radius: 10px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      #jump-input {
        width: 100%;
        background: var(--input);
        border: none;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font: 400 13px var(--sans);
        padding: 11px 14px;
      }
      #jump-input:focus {
        outline: none;
      }
      #jump-list {
        max-height: 320px;
        overflow-y: auto;
        padding: 4px;
      }
      #jump .jump-row {
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      #jump .jump-line {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #jump .jump-row:hover,
      #jump .jump-row.active {
        background: var(--panel-hover);
      }
      #jump .jump-row.stub .jump-title {
        font-style: italic;
        color: var(--text-4);
      }
      /* the active row expands with the node's content text; the search hits
         glow so a match deep in the body is visible immediately */
      #jump .jump-detail {
        display: none;
        position: relative;
        font: 400 10.5px/1.55 var(--sans);
        color: var(--text-3);
        margin: 5px 0 2px;
        padding-left: 9px;
        border-left: 2px solid var(--border-2);
        max-height: 88px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #jump .jump-row.active .jump-detail {
        display: block;
      }
      #jump .hit {
        font-style: normal;
        color: var(--yellow);
        background: var(--tint-yellow);
        border-radius: 3px;
        padding: 0 1px;
      }
      #jump .jump-id {
        font: 600 10.5px var(--mono);
        white-space: nowrap;
      }
      #jump .jump-title {
        font: 400 11.5px var(--sans);
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #jump .jump-empty {
        font: 400 11px var(--sans);
        color: var(--text-4);
        padding: 10px 12px;
      }
      /* the palette id colors ride the existing .k-<kind> classes */
      #jump .jump-id.k-document {
        color: var(--blue);
      }
      #jump .jump-id.k-fact {
        color: var(--accent);
      }
      #jump .jump-id.k-question {
        color: var(--yellow);
      }
      #jump .jump-id.k-hypothesis {
        color: var(--purple);
      }
      #jump .jump-id.k-tiltak {
        color: var(--green);
      }
      #jump .jump-id.k-dispatch {
        color: var(--orange);
      }
      #jump .jump-id.k-clock {
        color: var(--gold);
      }
      #jump .jump-id.k-conversation,
      #jump .jump-id.k-recipe,
      #jump .jump-id.k-proposal {
        color: var(--teal);
      }

      /* status bar */
      #statusbar {
        grid-area: status;
        background: var(--bg-side);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        font: 500 10px var(--mono);
        overflow: hidden;
        white-space: nowrap;
      }
      #statusbar .ok {
        color: var(--green);
      }
      #statusbar .pacing {
        color: var(--orange);
      }
      #statusbar .warn-c {
        color: var(--orange);
      }
      #statusbar .hint {
        margin-left: auto;
        color: var(--text-4);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <span class="logo"></span>
        <span class="name">Kildeverket</span>
        <span class="file">tiny-olsen.case.md</span>
        <span class="tabs">
          <a href="../script-editor/" title="script lens">Script</a>
          <span class="active">Canvas</span>
          <span title="not built — behind the fog">Pacing</span>
          <span title="not built">Playtest</span>
        </span>
        <button id="toggle-script" title="collapse/expand the script pane">script pane</button>
        <button id="toggle-worklist" title="loose ends — stubs, empty fields, diagnostics">
          loose ends · 0
        </button>
        <span id="counts"></span>
      </div>
      <div id="script-pane"></div>
      <div id="viewport">
        <div id="world">
          <svg id="edges"></svg>
          <div id="nodes"></div>
        </div>
        <div id="zoombar">
          <button id="z-out" title="zoom out">−</button>
          <span class="pct" id="z-pct">100%</span>
          <button id="z-in" title="zoom in">+</button>
          <button id="z-fit" title="fit the whole case">fit</button>
          <button id="z-layout" title="forget saved positions and lay out again">re-layout</button>
          <span class="zsep"></span>
          <button id="m-hand" title="kind columns — drag places a node, positions stick">
            hand
          </button>
          <button id="m-gravity" title="force-directed — the graph finds its own shape">
            gravity
          </button>
          <button id="m-pin" title="gravity until you drag — a drag pins, double-click frees">
            pin
          </button>
          <button id="f-engine" title="SB-080 A/B — toggle the force engine: d3-force vs the old hand-rolled sim">
            sim: d3
          </button>
        </div>
        <div id="legend"></div>
        <div id="worklist">
          <div class="head">LOOSE ENDS</div>
          <div id="worklist-body"></div>
        </div>
      </div>
      <div id="rightrail">
        <div class="rail-head"><span class="t" id="preview-title">GAME SURFACE</span></div>
        <div id="preview">
          <div class="empty">Click a node to see what the player sees.</div>
        </div>
        <div class="rail-head"><span class="t">INSPECTOR</span></div>
        <div id="inspector">
          <div id="inspector-body">
            <div class="empty">Click a node. Esc clears the selection.</div>
          </div>
        </div>
      </div>
      <div id="statusbar"></div>
    </div>
    <div id="jump">
      <div class="jump-box">
        <input
          id="jump-input"
          type="text"
          placeholder="jump to node — id or title"
          spellcheck="false"
        />
        <div id="jump-list"></div>
      </div>
    </div>
    <div id="doc-lightbox"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
